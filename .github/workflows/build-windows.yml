name: build-windows-exe

on:
  workflow_dispatch: {}          # 手动触发
  push:
    tags: ["v*"]                 # 或打 tag 触发

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview

      - name: Build exe (onedir)
        run: python -m PyInstaller --noconfirm --clean packaging\quantdesk.spec

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc packaging\installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantdesk-windows
          path: |
            packaging/dist/QuantDesk-Setup-*.exe
          if-no-files-found: error
