name: build-windows-exe

on:
  workflow_dispatch: {}          # 手动触发
  push:
    tags: ["v*"]                 # 或打 tag 触发

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview

      - name: Build exe (onedir)
        run: python -m PyInstaller --noconfirm --clean packaging\quantdesk.spec

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc packaging\installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantdesk-windows
          path: |
            packaging/dist/QuantDesk-Setup-*.exe
          if-no-files-found: error

      - name: Push installer to dist branch (for fast SSH fetch)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git fetch origin dist || true
          git checkout -B dist origin/dist 2>$null; if ($LASTEXITCODE -ne 0) { git checkout -B dist }
          Copy-Item packaging\dist\QuantDesk-Setup-*.exe .
          git add QuantDesk-Setup-*.exe
          git commit -m "dist: windows installer ($env:GITHUB_SHA)"
          git push -f origin dist

      - name: Create GitHub Release with installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-ChildItem packaging\dist\QuantDesk-Setup-*.exe | Select-Object -First 1).FullName
          "QuantDesk Windows 桌面版安装包（PyInstaller + Inno Setup）。系统要求 Windows 10/11 x64。数据目录 %LOCALAPPDATA%\QuantDesk\data" | Out-File -Encoding utf8 notes.txt
          gh release create $env:GITHUB_REF_NAME $exe --title "QuantDesk $env:GITHUB_REF_NAME" --notes-file notes.txt --clobber
          if ($LASTEXITCODE -ne 0) { gh release upload $env:GITHUB_REF_NAME $exe --clobber }

  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build           # 等 Windows job 先创建 Release
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK (debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $GITHUB_REF_NAME app/build/outputs/apk/debug/app-debug.apk --clobber
